<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | CorePoint POS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>body{background:linear-gradient(135deg,#1f2937,#0d6efd)}.login-card{max-width:430px;border:0;border-radius:1rem}.login-icon{width:4.5rem;height:4.5rem;display:grid;place-items:center;border-radius:50%;font-size:1.75rem}</style></head>
<body class="min-vh-100 d-flex align-items-center"><main class="container"><section class="login-card card shadow-lg mx-auto"><div class="card-body p-4 p-md-5"><div class="login-icon bg-primary-subtle text-primary mx-auto mb-3"><i class="fa-solid fa-lock"></i></div><h1 class="h3 text-center mb-2">Secure sign in</h1><p class="text-center text-muted mb-4">CorePoint POS access portal</p>{% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% endif %}{% if form.errors %}<div class="alert alert-danger"><i class="fa-solid fa-circle-exclamation me-1"></i>Your username or password is incorrect, or this account has been disabled.</div>{% endif %}<form method="post">{% csrf_token %}<div class="mb-3"><label for="id_username" class="form-label">Username</label><div class="input-group"><span class="input-group-text"><i class="fa-solid fa-user"></i></span><input type="text" name="username" id="id_username" class="form-control" autofocus required></div></div><div class="mb-4"><label for="id_password" class="form-label">Password</label><div class="input-group"><span class="input-group-text"><i class="fa-solid fa-key"></i></span><input type="password" name="password" id="id_password" class="form-control" required></div></div><input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary w-100" type="submit"><i class="fa-solid fa-right-to-bracket me-1"></i>Sign in</button></form><hr class="my-4"><p class="text-center text-muted mb-2">New to CorePoint POS?</p><a class="btn btn-outline-primary w-100" href="{% url 'users:register' %}"><i class="fa-solid fa-user-plus me-1"></i>Create an account</a></div></section></main></body></html>
