<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <main class="container" style="max-width: 430px;">
        <section class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 text-center mb-2">Welcome back</h1>
                <p class="text-center text-muted mb-4">Sign in to access the POS.</p>
                {% if form.errors %}
                    <div class="alert alert-danger">Your username or password is incorrect.</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control" autofocus required>
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control" required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button class="btn btn-primary w-100" type="submit">Sign in</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
