{% extends "base.html" %}
{% block title %}Reset Password | CorePoint POS{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-6"><div class="app-card card"><div class="card-body p-4"><h1 class="h4">Reset password for {{ staff_user.username }}</h1><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}<div class="small text-danger">{{ field.errors }}</div></div>{% endfor %}<button class="btn btn-primary">Set Password</button></form></div></div></div></div>{% endblock %}
