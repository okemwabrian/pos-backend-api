name: Build CHIWAS POS releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chiwas-pos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK and portable desktop packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build web app and synchronize Capacitor
        working-directory: mobile
        run: |
          npm run build
          npx cap sync android

      - name: Build installable Android APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Package portable desktop downloads
        run: bash release/package_portable.sh

      - name: Stage APK with release filename
        run: |
          mkdir -p release/dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            release/dist/Chiwas-Liquor-POS.apk

      - name: Upload downloadable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chiwas-pos-downloads
          if-no-files-found: error
          retention-days: 30
          path: |
            release/dist/Chiwas-Liquor-POS.apk
            release/dist/Chiwas-POS-Windows-7-8-10-11.zip
            release/dist/Chiwas-POS-Ubuntu.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: CHIWAS POS build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/dist/Chiwas-Liquor-POS.apk
            release/dist/Chiwas-POS-Windows-7-8-10-11.zip
            release/dist/Chiwas-POS-Ubuntu.zip
