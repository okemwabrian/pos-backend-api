name: Build FREE HOUSE POS releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-house-pos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Windows build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt

      - name: Build Django POS Windows application
        run: pyinstaller --noconfirm --clean build_windows.spec

      - name: Smoke-test Windows application
        shell: pwsh
        run: |
          $env:CHIWAS_OPEN_BROWSER = "0"
          $process = Start-Process -FilePath "dist/ChiwasLiquorPOS.exe" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8765/setup/" -TimeoutSec 2
                if ($response.Content -match "Create both administrator accounts") {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "Windows POS did not serve the Django setup page. Process exit code: $($process.ExitCode)"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" release/windows/installer.iss'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: free-house-pos-windows-installer
          path: dist/FREE-HOUSE-POS-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build Android APK and Django desktop ZIPs
    runs-on: ubuntu-latest
    needs: build-windows-installer
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build web app and synchronize Capacitor
        working-directory: mobile
        run: |
          npm run build
          npx cap sync android

      - name: Build installable Android APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Package Django desktop downloads
        run: bash release/package_portable.sh

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: free-house-pos-windows-installer
          path: release/dist

      - name: Stage APK with release filename
        run: |
          mkdir -p release/dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            release/dist/Free-House-POS.apk

      - name: Upload downloadable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: free-house-pos-downloads
          if-no-files-found: error
          retention-days: 30
          path: |
            release/dist/Free-House-POS.apk
            release/dist/FREE-HOUSE-POS-Windows-Setup.exe
            release/dist/FREE-HOUSE-POS-Windows-Source.zip
            release/dist/Free-House-POS-Ubuntu.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: FREE HOUSE POS build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/dist/Free-House-POS.apk
            release/dist/FREE-HOUSE-POS-Windows-Setup.exe
            release/dist/FREE-HOUSE-POS-Windows-Source.zip
            release/dist/Free-House-POS-Ubuntu.zip
